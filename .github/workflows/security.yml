name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly-disclosed issue in a pinned action surfaces without
    # waiting for someone to open a PR.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists a PR's commits to scope its scan
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks needs history to scan past commits
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-lint:
    name: PSScriptAnalyzer security rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install analyzers
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module InjectionHunter -Force -Scope CurrentUser -SkipPublisherCheck -ErrorAction SilentlyContinue
      - name: Injection and credential rules
        shell: pwsh
        run: |
          # PSScriptAnalyzer's security-relevant built-ins. These are precise
          # rather than heuristic, so they stay a hard failure; they target the
          # two things that would actually matter here: building code from
          # untrusted strings, and mishandling credentials. The heuristic
          # InjectionHunter pass runs separately, in the step below.
          $rules = @(
            'PSAvoidUsingPlainTextForPassword'
            'PSAvoidUsingConvertToSecureStringWithPlainText'
            'PSUsePSCredentialType'
            'PSAvoidUsingUserNameAndPasswordParams'
            'PSAvoidUsingInvokeExpression'
            'PSAvoidUsingComputerNameHardcoded'
            'PSUsingInvokeExpressionUnsafely'
          )
          $findings = @(Invoke-ScriptAnalyzer -Path ./src -Recurse -IncludeRule $rules)
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName, Severity, Line, Message | Out-String -Width 200 | Write-Host
            throw "$($findings.Count) finding(s) from the built-in security rules."
          }
          Write-Host 'Built-in security rules: clean.'

      - name: InjectionHunter (baselined)
        shell: pwsh
        # Findings are matched to reviewed sites by fingerprint, not by count,
        # so swapping a safe hit for an unsafe one cannot pass on an unchanged
        # total. The check lives in the repo so it runs the same way locally.
        run: ./build/Test-InjectionBaseline.ps1

  contract:
    name: Read-only + credential contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Assert the safety contract
        shell: pwsh
        run: |
          # These are the promises the README makes to anyone about to run this
          # against production with admin rights. They are enforced, not assumed.
          Import-Module Pester -MinimumVersion 5.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests/Contract.Tests.ps1'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) contract test(s) failed." }

  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # writes its results to the code-scanning dashboard
      id-token: write          # publishes to the public Scorecard API
      actions: read            # reads workflow runs for the dangerous-workflow checks
    # Scorecard only works on a public repository - it reads commit and workflow
    # history through an API that returns "Resource not accessible by
    # integration" while the repo is private. Skipping is honest; a job that can
    # never pass just teaches people to ignore a red X.
    if: github.event_name != 'pull_request' && github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
