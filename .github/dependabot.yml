version: 2

updates:
  # This project has no runtime package dependencies - it is a single
  # PowerShell script that uses only in-box Windows cmdlets, deliberately, so
  # it can run on a locked-down or air-gapped host with nothing to install.
  #
  # The real supply-chain surface is therefore the CI itself: the third-party
  # GitHub Actions that run with access to this repository.
  #
  # Every `uses:` is pinned to a full commit SHA rather than a tag, because a
  # tag is mutable: whoever controls the action's repository can repoint v3 at
  # new code and it runs here on the next build, with this repo's token. That
  # is not hypothetical - it is how the tj-actions/changed-files and Trivy
  # ecosystem compromises reached their downstream users. The trailing comment
  # records the human-readable version; Dependabot reads it, and updates both
  # the SHA and the comment together. Dependabot doing that reliably is what
  # keeps a pin from silently rotting into an unpatched dependency.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # One PR for routine bumps; security fixes still come through on their own.
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The report's browser test is the only place npm is used, and only in CI.
  - package-ecosystem: "npm"
    directory: "/tests/browser"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "test"
    labels:
      - "dependencies"
      - "tests"
